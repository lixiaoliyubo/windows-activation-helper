name: 自动构建与发布

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.workbuddy/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 计算版本号
        id: version
        shell: bash
        run: echo "value=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 构建
        shell: cmd
        run: dotnet build src\MasActivator\MasActivator.csproj -c Release --nologo -p:Version=${{ steps.version.outputs.value }}

      - name: 复制成品
        shell: cmd
        run: copy /Y src\MasActivator\bin\Release\net48\WindowsActivationHelper.exe publish\WindowsActivationHelper.exe

      - name: 回写成品到仓库
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish/WindowsActivationHelper.exe
          if ! git diff --cached --quiet; then
            git commit -m "chore: 自动构建 v${{ steps.version.outputs.value }} [skip ci]"
            git push
          fi

      - name: 同步成品到 Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -n "$GITEE_TOKEN" ]; then
            curl -k -sS -X POST \
              -H "Content-Type: application/json" \
              -d "{\"access_token\":\"$GITEE_TOKEN\",\"content\":\"$(base64 -w0 publish/WindowsActivationHelper.exe)\",\"encoding\":\"base64\",\"message\":\"chore: 同步构建产物 v${{ steps.version.outputs.value }}\",\"branch\":\"main\"}" \
              "https://gitee.com/api/v5/repos/lixiaoliyubo/windows-activation-helper/contents/publish/WindowsActivationHelper.exe"
            curl -k -sS -X POST \
              -d "access_token=$GITEE_TOKEN" \
              -d "tag_name=v${{ steps.version.outputs.value }}" \
              -d "name=v${{ steps.version.outputs.value }}" \
              -d "body=自动构建发布 v${{ steps.version.outputs.value }}" \
              -d "target_commitish=main" \
              "https://gitee.com/api/v5/repos/lixiaoliyubo/windows-activation-helper/releases"
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          body: |
            自动构建发布 v${{ steps.version.outputs.value }}
            基于 MAS 3.14，单文件 exe，无需安装运行时。
          files: publish/WindowsActivationHelper.exe
          generate_release_notes: true
