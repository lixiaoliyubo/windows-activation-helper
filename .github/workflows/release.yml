name: 自动构建与发布

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.workbuddy/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 计算版本号
        id: version
        shell: bash
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/MasActivator/MasActivator.csproj | head -n1)
          if [ -z "$v" ]; then v=1.0.0; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: 判断该版本是否已发布
        id: check
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.value }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建
        if: steps.check.outputs.exists == 'false'
        shell: cmd
        run: dotnet build src\MasActivator\MasActivator.csproj -c Release --nologo -p:Version=${{ steps.version.outputs.value }}

      - name: 复制成品
        if: steps.check.outputs.exists == 'false'
        shell: cmd
        run: copy /Y src\MasActivator\bin\Release\net48\WindowsActivationHelper.exe publish\WindowsActivationHelper.exe

      - name: 写入版本清单
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: echo "${{ steps.version.outputs.value }}" > publish/version.txt

      - name: 回写成品到仓库
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish/WindowsActivationHelper.exe publish/version.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: 自动构建 v${{ steps.version.outputs.value }} [skip ci]"
            git push
          fi

      - name: 同步成品到 Gitee
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN 未配置，无法同步到 Gitee"
            exit 1
          fi
          set -e
          echo "更新 Gitee 仓库内 exe..."
          sha=$(curl -k -sS \
            "https://gitee.com/api/v5/repos/lixiaoliyubo/windows-activation-helper/contents/publish/WindowsActivationHelper.exe?access_token=$GITEE_TOKEN&ref=main" \
            | grep -o '"sha":"[a-f0-9]*"' | head -n1 | cut -d'"' -f4)
          sha_json=""
          if [ -n "$sha" ]; then sha_json=",\"sha\":\"$sha\""; fi
          payload_file=$(mktemp)
          printf '{"access_token":"%s","content":"%s","encoding":"base64","message":"chore: 同步构建产物 v%s","branch":"main"%s}' \
            "$GITEE_TOKEN" "$(base64 -w0 publish/WindowsActivationHelper.exe)" "${{ steps.version.outputs.value }}" "$sha_json" > "$payload_file"
          resp=$(curl -k -sS -w "\n%{http_code}" -X PUT \
            -H "Content-Type: application/json" \
            -d @"$payload_file" \
            "https://gitee.com/api/v5/repos/lixiaoliyubo/windows-activation-helper/contents/publish/WindowsActivationHelper.exe")
          rm -f "$payload_file"
          code=$(echo "$resp" | tail -n1)
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            echo "::error::更新 Gitee exe 失败 HTTP $code: $resp"
            exit 1
          fi
          echo "创建 Gitee Release v${{ steps.version.outputs.value }}..."
          resp=$(curl -k -sS -w "\n%{http_code}" -X POST \
            -d "access_token=$GITEE_TOKEN" \
            -d "tag_name=v${{ steps.version.outputs.value }}" \
            -d "name=v${{ steps.version.outputs.value }}" \
            -d "body=Release v${{ steps.version.outputs.value }} (MAS 3.14, single-file exe)" \
            -d "target_commitish=main" \
            "https://gitee.com/api/v5/repos/lixiaoliyubo/windows-activation-helper/releases")
          code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | head -n -1)
          if [ "$code" != "201" ]; then
            echo "::warning::创建 Gitee Release 返回 HTTP $code（若 tag 已存在可忽略）: $body"
          else
            release_id=$(echo "$body" | grep -o '"id":[0-9]*' | head -n1 | cut -d: -f2)
            echo "上传 exe 附件到 Release $release_id..."
            curl -k -sS -X POST \
              -H "Content-Type: multipart/form-data" \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@publish/WindowsActivationHelper.exe" \
              "https://gitee.com/api/v5/repos/lixiaoliyubo/windows-activation-helper/releases/$release_id/attach_files"
          fi
          echo "Gitee 同步完成"

      - name: 打版本标签
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          # 显式创建标签：消息保持 ASCII，避免 Windows runner 编码把中文写成 ?????
          if git rev-parse "v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "标签已存在，跳过"
          else
            git tag -a "v${{ steps.version.outputs.value }}" -m "Release v${{ steps.version.outputs.value }}"
            git push origin "v${{ steps.version.outputs.value }}"
          fi

      - name: 创建 Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          body: |
            Release v${{ steps.version.outputs.value }}
            基于 MAS 3.14，单文件 exe，无需安装运行时。
          files: publish/WindowsActivationHelper.exe
          generate_release_notes: true
